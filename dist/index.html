<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="HostControl — agencja digital. Strony i aplikacje, branding, produkcja foto-video, ujęcia z drona i realizacja wydarzeń.">
  <title>HostControl — agencja digital</title>
  <style>
    :root {
      color-scheme: dark;
      --red: #e31b23;
      --red-deep: #8f0711;
      --white: #f7f5f2;
      --muted: rgba(247, 245, 242, .62);
      --line: rgba(255, 255, 255, .18);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; background: #080808; }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, a { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100svh;
      height: 100dvh;
      isolation: isolate;
      overflow: hidden;
      background: #0a0808;
    }

    .media, .video-slide, .video-slide video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .video-slide {
      z-index: -5;
      opacity: 0;
      transform: scale(1.045);
      transition: opacity 1s ease, transform 2.2s var(--ease);
      background: #0a0808 center / cover no-repeat;
    }

    .video-slide.active { opacity: 1; transform: scale(1); }

    .video-slide video {
      object-fit: cover;
      object-position: center;
      filter: saturate(.76) contrast(1.08) brightness(.82);
    }

    .video-slide[data-slide="0"] video { object-position: 50% 43%; }
    .video-slide[data-slide="1"] video { object-position: 56% 50%; }
    .video-slide[data-slide="2"] video { object-position: 50% 54%; filter: saturate(.3) contrast(1.14) brightness(.66); }
    .video-slide[data-slide="3"] video { object-position: 51% 42%; }

    .wash {
      position: absolute;
      inset: 0;
      z-index: -4;
      background:
        radial-gradient(circle at 80% 20%, rgba(227, 27, 35, .22), transparent 34%),
        linear-gradient(90deg, rgba(0,0,0,.63) 0%, rgba(0,0,0,.05) 48%, rgba(0,0,0,.42) 100%),
        linear-gradient(180deg, rgba(0,0,0,.38) 0%, transparent 32%, rgba(0,0,0,.62) 100%),
        rgba(128, 0, 10, .18);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .wash::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(118deg, transparent 0 57%, rgba(227,27,35,.2) 68%, transparent 84%);
      mix-blend-mode: screen;
      opacity: .75;
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 10;
      opacity: .055;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    }

    .topbar {
      position: relative;
      z-index: 20;
      height: 54px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: env(safe-area-inset-top, 0) clamp(22px, 4vw, 68px) 0;
    }

    .brand { width: clamp(158px, 15vw, 214px); display: block; }
    .brand img { display: block; width: 100%; height: auto; }

    .nav {
      display: flex;
      align-items: center;
      gap: clamp(24px, 3vw, 50px);
      font-size: .75rem;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .nav a { position: relative; padding: 12px 0; color: rgba(255,255,255,.74); transition: color .25s ease; }
    .nav a:hover, .nav a:focus-visible { color: #fff; }
    .nav a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 4px; height: 1px; background: var(--red); transition: right .35s var(--ease); }
    .nav a:hover::after, .nav a:focus-visible::after { right: 0; }

    .header-actions { justify-self: end; display: flex; align-items: center; gap: 22px; }
    .phone { font-size: .78rem; letter-spacing: .12em; font-weight: 650; }

    .menu-button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(0,0,0,.12);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .25s ease, border-color .25s ease, transform .25s ease;
    }

    .menu-button:hover, .menu-button:focus-visible { background: var(--red); border-color: var(--red); transform: rotate(4deg); }
    .menu-icon { width: 17px; display: grid; gap: 4px; }
    .menu-icon i { display: block; height: 1.5px; background: #fff; border-radius: 2px; transition: transform .35s var(--ease), opacity .25s ease; }

    .hero-main {
      position: absolute;
      z-index: 15;
      inset: 99px 0 98px;
      display: grid;
      place-items: center;
      padding: 44px clamp(22px, 6vw, 96px);
      text-align: center;
    }

    .hero-copy { width: min(1180px, 100%); transform: translateY(2vh); }

    .eyebrow {
      position: relative;
      top: -52px;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: clamp(18px, 3vh, 34px);
      font-size: clamp(.7rem, 1vw, .82rem);
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .eyebrow .index { color: var(--red); }
    .eyebrow .divider { width: 42px; height: 1px; background: rgba(255,255,255,.55); }
    .eyebrow .service { min-width: 180px; text-align: left; }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 10.7vw, 10.3rem);
      line-height: .81;
      letter-spacing: -.082em;
      font-weight: 880;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 10px 40px rgba(0,0,0,.22);
    }

    h1 span { color: transparent; -webkit-text-stroke: 1.6px rgba(255,255,255,.9); }

    .tagline {
      min-height: 1.6em;
      margin: clamp(25px, 3.5vh, 40px) auto 0;
      font-size: clamp(.92rem, 1.7vw, 1.36rem);
      font-weight: 390;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.88);
    }

    .hero-copy > * { will-change: transform, opacity, filter; }
    .hero-copy.is-initial .eyebrow { animation: contentFromLeft .76s var(--ease) .04s both; }
    .hero-copy.is-initial h1 { animation: contentFromLeft .82s var(--ease) .14s both; }
    .hero-copy.is-initial .tagline { animation: contentFromLeft .78s var(--ease) .27s both; }
    .hero-copy.is-initial .cta { animation: contentFromLeft .82s var(--ease) .4s both; }

    .hero-copy.is-exiting-left .eyebrow { animation: contentToLeft .4s cubic-bezier(.55,.05,.86,.48) 0s both; }
    .hero-copy.is-exiting-left h1 { animation: contentToLeft .42s cubic-bezier(.55,.05,.86,.48) .045s both; }
    .hero-copy.is-exiting-left .tagline { animation: contentToLeft .4s cubic-bezier(.55,.05,.86,.48) .09s both; }
    .hero-copy.is-exiting-left .cta { animation: contentToLeft .4s cubic-bezier(.55,.05,.86,.48) .135s both; }
    .hero-copy.is-entering-right .eyebrow { animation: contentFromRight .72s var(--ease) .03s both; }
    .hero-copy.is-entering-right h1 { animation: contentFromRight .8s var(--ease) .12s both; }
    .hero-copy.is-entering-right .tagline { animation: contentFromRight .74s var(--ease) .23s both; }
    .hero-copy.is-entering-right .cta { animation: contentFromRight .78s var(--ease) .34s both; }

    .hero-copy.is-exiting-right .eyebrow { animation: contentToRight .4s cubic-bezier(.55,.05,.86,.48) 0s both; }
    .hero-copy.is-exiting-right h1 { animation: contentToRight .42s cubic-bezier(.55,.05,.86,.48) .045s both; }
    .hero-copy.is-exiting-right .tagline { animation: contentToRight .4s cubic-bezier(.55,.05,.86,.48) .09s both; }
    .hero-copy.is-exiting-right .cta { animation: contentToRight .4s cubic-bezier(.55,.05,.86,.48) .135s both; }
    .hero-copy.is-entering-left .eyebrow { animation: contentFromLeft .72s var(--ease) .03s both; }
    .hero-copy.is-entering-left h1 { animation: contentFromLeft .8s var(--ease) .12s both; }
    .hero-copy.is-entering-left .tagline { animation: contentFromLeft .74s var(--ease) .23s both; }
    .hero-copy.is-entering-left .cta { animation: contentFromLeft .78s var(--ease) .34s both; }

    @keyframes contentFromLeft { from { opacity: 0; transform: translateX(-60vw); filter: blur(7px); } to { opacity: 1; transform: translateX(0); filter: blur(0); } }
    @keyframes contentFromRight { from { opacity: 0; transform: translateX(60vw); filter: blur(7px); } to { opacity: 1; transform: translateX(0); filter: blur(0); } }
    @keyframes contentToLeft { from { opacity: 1; transform: translateX(0); filter: blur(0); } to { opacity: 0; transform: translateX(-60vw); filter: blur(6px); } }
    @keyframes contentToRight { from { opacity: 1; transform: translateX(0); filter: blur(0); } to { opacity: 0; transform: translateX(60vw); filter: blur(6px); } }

    .cta {
      position: relative;
      top: 38px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-top: clamp(26px, 4vh, 42px);
      padding: 13px 15px 13px 22px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 999px;
      background: rgba(8,8,8,.22);
      backdrop-filter: blur(8px);
      font-size: .74rem;
      font-weight: 720;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: background .3s ease, border-color .3s ease, transform .3s var(--ease);
    }

    .cta b { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--red); font-size: 1rem; font-weight: 400; transition: transform .3s var(--ease); }
    .cta:hover, .cta:focus-visible { background: rgba(227,27,35,.88); border-color: var(--red); transform: translateY(-2px); }
    .cta:hover b, .cta:focus-visible b { transform: translateX(3px); background: #fff; color: #111; }

    .side-note {
      position: absolute;
      left: clamp(22px, 4vw, 68px);
      top: 50%;
      z-index: 16;
      writing-mode: vertical-rl;
      transform: translateY(-50%) rotate(180deg);
      color: rgba(255,255,255,.48);
      font-size: .65rem;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .socials {
      position: absolute;
      right: clamp(22px, 4vw, 68px);
      top: 50%;
      z-index: 16;
      transform: translateY(-50%);
      display: grid;
      gap: 16px;
    }

    .socials a { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-size: .68rem; font-weight: 700; transition: background .25s ease, border-color .25s ease; }
    .socials a:hover, .socials a:focus-visible { background: var(--red); border-color: var(--red); }

    .bottom-nav {
      --active-x: 0%;
      position: absolute;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 56px;
      padding-bottom: env(safe-area-inset-bottom, 0);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      isolation: isolate;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(7,7,7,.16), rgba(5,5,5,.58));
      backdrop-filter: blur(12px) saturate(1.08);
      border-top: 1px solid rgba(255,255,255,.1);
      box-shadow: none;
    }

    .bottom-nav::before {
      content: "";
      position: absolute;
      z-index: 4;
      bottom: env(safe-area-inset-bottom, 0);
      left: var(--active-x);
      width: 25%;
      height: 1px;
      background: linear-gradient(90deg, transparent 13%, rgba(227,27,35,.85) 50%, transparent 87%);
      filter: drop-shadow(0 0 3px rgba(227,27,35,.38));
      transition: left .78s var(--ease);
    }

    .active-track {
      position: absolute;
      z-index: 0;
      top: 0;
      bottom: env(safe-area-inset-bottom, 0);
      left: var(--active-x);
      width: 25%;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 105%, rgba(227,27,35,.11), transparent 68%);
      box-shadow: none;
      transition: left .78s var(--ease);
      pointer-events: none;
    }

    .active-track::before {
      display: none;
    }

    .bottom-nav.is-switching .active-track::before { animation: none; }

    .active-track::after {
      display: none;
    }

    .slide-button {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 8px;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      transition: color .35s ease;
    }

    .slide-button::before { content: ""; position: absolute; left: 22%; right: 78%; bottom: env(safe-area-inset-bottom, 0); height: 1px; border-radius: 2px; background: rgba(255,255,255,.34); box-shadow: none; }
    .slide-button.active::before { animation: progress 8s linear forwards; }
    @keyframes progress { from { right: 78%; } to { right: 22%; } }

    .slide-button::after {
      display: none;
    }

    .slide-button.pulse::after { animation: none; }

    .icon-wrap {
      position: relative;
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      color: rgba(255,255,255,.38);
      background: transparent;
      transition: color .45s ease, transform .5s var(--ease), opacity .45s ease;
    }

    .service-icon { width: 17px; height: 17px; overflow: visible; }
    .service-icon * { vector-effect: non-scaling-stroke; }
    .button-copy { min-width: 0; display: grid; gap: 0; }
    .slide-button .num, .slide-button .caption { display: none; }
    .slide-button .label { font-size: clamp(.62rem, .78vw, .72rem); letter-spacing: .12em; font-weight: 650; text-transform: uppercase; color: rgba(255,255,255,.42); transition: color .45s ease, opacity .45s ease; }

    .slide-button:hover .icon-wrap, .slide-button:focus-visible .icon-wrap { color: rgba(255,255,255,.86); transform: translateY(-1px); }
    .slide-button.active .icon-wrap { color: rgba(239,45,53,.96); background: transparent; border-color: transparent; box-shadow: none; }
    .slide-button.active .label { color: rgba(255,255,255,.92); transform: none; }

    .slide-button.active .branding-orbit { transform-origin: 12px 12px; animation: iconOrbit 14s linear infinite; }
    .slide-button.active .digital-scan { animation: scanLine 3.2s ease-in-out infinite; }
    .slide-button.active .drone-body { animation: droneFloat 3.6s ease-in-out infinite; }
    .slide-button.active .drone-rotor { transform-origin: center; animation: rotorBlink 1.2s ease-in-out infinite alternate; }
    .slide-button.active .event-wave { transform-origin: center; animation: eventWave 2.8s ease-in-out infinite alternate; }
    .slide-button.active .event-star { transform-origin: 18px 6px; animation: starPulse 3.4s ease-in-out infinite; }
    @keyframes iconOrbit { to { transform: rotate(360deg); } }
    @keyframes scanLine { 0%,100% { transform: translateY(-1px); opacity: .5; } 50% { transform: translateY(1px); opacity: .92; } }
    @keyframes droneFloat { 0%,100% { transform: translateY(.5px); } 50% { transform: translateY(-1px); } }
    @keyframes rotorBlink { to { opacity: .62; transform: scaleX(.92); } }
    @keyframes eventWave { to { transform: scaleY(.82); opacity: .72; } }
    @keyframes starPulse { 0%,100% { transform: scale(.88); opacity: .62; } 50% { transform: scale(1.04); opacity: .95; } }

    .trust-strip {
      position: relative;
      z-index: 2;
      height: 78px;
      display: grid;
      grid-template-columns: clamp(156px, 16vw, 238px) minmax(0, 1fr);
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 0%, rgba(227,27,35,.07), transparent 34%),
        linear-gradient(180deg, #0b0b0c, #070708);
      border-top: 1px solid rgba(255,255,255,.11);
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .trust-strip::after {
      content: "";
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: -18%;
      width: 18%;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 15%, rgba(255,255,255,.045) 50%, transparent 85%);
      transform: skewX(-18deg);
      animation: filmLight 9s ease-in-out infinite;
    }

    .trust-heading {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 clamp(18px, 3vw, 48px);
      background: rgba(8,8,9,.92);
      border-right: 1px solid rgba(255,255,255,.08);
      white-space: nowrap;
    }

    .trust-heading::before {
      content: "";
      width: 18px;
      height: 1px;
      flex: 0 0 auto;
      background: var(--red);
      box-shadow: 0 0 8px rgba(227,27,35,.35);
    }

    .trust-heading strong {
      font-size: .75rem;
      font-weight: 680;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(255,255,255,.82);
    }

    .trust-window {
      position: relative;
      min-width: 0;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
    }

    .trust-track {
      height: 100%;
      display: flex;
      align-items: center;
      width: max-content;
      animation: trustMarquee 38s linear infinite;
      will-change: transform;
    }

    .trust-run {
      height: 100%;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: clamp(34px, 4vw, 62px);
      padding-right: clamp(34px, 4vw, 62px);
    }

    .client-logo {
      width: clamp(132px, 10vw, 174px);
      height: 58px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      opacity: .58;
      transition: opacity .35s ease, transform .45s var(--ease);
    }

    .client-logo img {
      display: block;
      max-width: 100%;
      max-height: 44px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: grayscale(1) brightness(0) invert(1);
    }

    .client-logo--wide img { max-width: 154px; max-height: 34px; }
    .client-logo--kurka img { max-width: 92px; max-height: 48px; }
    .client-logo--krzywe img { max-width: 86px; max-height: 50px; }
    .client-logo:hover { opacity: .9; transform: translateY(-1px); }
    .trust-window:hover .trust-track { animation-play-state: paused; }

    @keyframes trustMarquee { to { transform: translateX(-50%); } }
    @keyframes filmLight { 0%, 66% { left: -18%; opacity: 0; } 72% { opacity: 1; } 88% { left: 110%; opacity: .75; } 100% { left: 110%; opacity: 0; } }

    .menu-panel {
      position: absolute;
      z-index: 18;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8,8,8,.96);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-18px);
      transition: opacity .45s ease, visibility .45s ease, transform .55s var(--ease);
    }

    .menu-panel.open { opacity: 1; visibility: visible; transform: none; }
    .menu-panel nav { display: grid; text-align: center; gap: 12px; }
    .menu-panel a { font-size: clamp(2.2rem, 6vw, 5.5rem); line-height: 1; font-weight: 840; letter-spacing: -.055em; text-transform: uppercase; transition: color .2s ease; }
    .menu-panel a:hover, .menu-panel a:focus-visible { color: var(--red); }
    .menu-open .menu-icon i:first-child { transform: translateY(3.25px) rotate(45deg); }
    .menu-open .menu-icon i:last-child { transform: translateY(-3.25px) rotate(-45deg); }

    @media (max-width: 900px) {
      .topbar { height: calc(42px + env(safe-area-inset-top, 0)); grid-template-columns: 1fr auto; padding-left: 17px; padding-right: 15px; }
      .brand { width: clamp(124px, 36vw, 154px); }
      .menu-button { width: 34px; height: 34px; }
      .nav, .phone, .side-note, .socials { display: none; }
      .hero-main { inset: calc(80px + env(safe-area-inset-top, 0)) 0 calc(82px + env(safe-area-inset-bottom, 0)); padding: 24px 16px; }
      .hero-copy { transform: translateY(-1vh); }
      h1 { font-size: clamp(2.75rem, 12.6vw, 5.2rem); letter-spacing: -.07em; line-height: .88; }
      h1 span { -webkit-text-stroke-width: 1px; }
      .eyebrow { top: -43px; margin-bottom: 24px; gap: 9px; letter-spacing: .16em; }
      .eyebrow .divider { width: 24px; }
      .eyebrow .service { min-width: 128px; }
      .tagline { width: min(86vw, 430px); font-size: clamp(.78rem, 3.4vw, 1rem); letter-spacing: .12em; line-height: 1.55; margin-top: 24px; }
      .cta { top: 34px; margin-top: 28px; }
      .bottom-nav { min-height: calc(44px + env(safe-area-inset-bottom, 0)); }
      .active-track { top: 0; bottom: env(safe-area-inset-bottom, 0); left: var(--active-x); width: 25%; border-radius: 0; }
      .slide-button { justify-content: center; flex-direction: row; gap: 5px; padding: 3px 1px; text-align: center; }
      .icon-wrap { width: 16px; height: 16px; border-radius: 0; }
      .service-icon { width: 14px; height: 14px; }
      .button-copy { gap: 0; }
      .slide-button .num { display: none; }
      .slide-button .label { font-size: clamp(.48rem, 2.05vw, .58rem); letter-spacing: .055em; }
      .slide-button .caption { display: none; }
      .slide-button.active .label { transform: none; }
      .video-slide[data-slide="0"] video { object-position: 52% 50%; }
      .video-slide[data-slide="1"] video { object-position: 60% 50%; }
      .video-slide[data-slide="2"] video { object-position: 50% 50%; }
      .video-slide[data-slide="3"] video { object-position: 45% 50%; }

  <script>
    (() => {
      const slides = [...document.querySelectorAll('.video-slide')];
      const buttons = [...document.querySelectorAll('.slide-button')];
      const indexEl = document.querySelector('.eyebrow .index');
      const serviceEl = document.querySelector('.eyebrow .service');
      const taglineEl = document.querySelector('.tagline');
      const heroCopy = document.querySelector('.hero-copy');
      const menuButton = document.querySelector('.menu-button');
      const menuPanel = document.querySelector('.menu-panel');
      const bottomNav = document.querySelector('.bottom-nav');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const copy = [
        ['Kreacja i branding', 'Tworzymy marki, które zostają'],
        ['Strony i aplikacje', 'Digital, który pracuje na Twój wynik'],
        ['Foto i ujęcia z drona', 'Nowa perspektywa dla Twojej marki'],
        ['Eventy w całej Polsce', 'Od pomysłu do ostatniego światła']
      ];
      let active = 0;
      let timer;
      let transitioning = false;
      let queuedChange = null;

      function applySlide(next, userInitiated = false) {
        active = next;
        slides.forEach((slide, i) => {
          const isActive = i === active;
          slide.classList.toggle('active', isActive);
          const video = slide.querySelector('video');
          if (isActive && !reduceMotion) {
            if (userInitiated) video.currentTime = 0;
            video.play().catch(() => {});
          } else video.pause();
        });
        buttons.forEach((button, i) => {
          button.classList.remove('active');
          button.setAttribute('aria-pressed', i === active ? 'true' : 'false');
        });
        void buttons[active].offsetWidth;
        buttons[active].classList.add('active');
        bottomNav.style.setProperty('--active-x', `${active * 25}%`);
        indexEl.textContent = `${String(active + 1).padStart(2, '0')} / 04`;
        serviceEl.textContent = copy[active][0];
        taglineEl.textContent = copy[active][1];
      }

      function show(next, userInitiated = false, forcedDirection = null) {
        const target = (next + slides.length) % slides.length;
        if (target === active) {
          if (userInitiated) {
            const video = slides[active].querySelector('video');
            video.currentTime = 0;
            video.play().catch(() => {});
          }
          if (!reduceMotion) restartTimer();
          return;
        }

        const circularDistance = (target - active + slides.length) % slides.length;
        const direction = forcedDirection || (circularDistance <= slides.length / 2 ? 'forward' : 'backward');

        if (reduceMotion) {
          applySlide(target, userInitiated);
          return;
        }

        if (transitioning) {
          queuedChange = { target, userInitiated, direction };
          return;
        }

        transitioning = true;
        clearTimeout(timer);
        heroCopy.classList.remove('is-initial', 'is-entering-left', 'is-entering-right', 'is-exiting-left', 'is-exiting-right');
        void heroCopy.offsetWidth;
        heroCopy.classList.add(direction === 'forward' ? 'is-exiting-left' : 'is-exiting-right');

        setTimeout(() => {
          applySlide(target, userInitiated);
          heroCopy.classList.remove('is-exiting-left', 'is-exiting-right');
          void heroCopy.offsetWidth;
          heroCopy.classList.add(direction === 'forward' ? 'is-entering-right' : 'is-entering-left');

          setTimeout(() => {
            heroCopy.classList.remove('is-entering-left', 'is-entering-right');
            transitioning = false;
            if (queuedChange) {
              const queued = queuedChange;
              queuedChange = null;
              show(queued.target, queued.userInitiated, queued.direction);
            } else restartTimer();
          }, 1160);
        }, 570);
      }

      function restartTimer() {
        clearTimeout(timer);
        timer = setTimeout(() => show(active + 1, false, 'forward'), 8000);
      }

      buttons.forEach((button, i) => button.addEventListener('click', () => show(i, true)));
      document.addEventListener('keydown', event => {
        if (event.key === 'ArrowRight') show(active + 1, true, 'forward');
        if (event.key === 'ArrowLeft') show(active - 1, true, 'backward');
        if (event.key === 'Escape' && menuPanel.classList.contains('open')) toggleMenu(false);
      });

      function toggleMenu(force) {
        const open = typeof force === 'boolean' ? force : !menuPanel.classList.contains('open');
        menuPanel.classList.toggle('open', open);
        document.body.classList.toggle('menu-open', open);
        menuButton.setAttribute('aria-expanded', String(open));
        menuButton.setAttribute('aria-label', open ? 'Zamknij menu' : 'Otwórz menu');
        menuPanel.setAttribute('aria-hidden', String(!open));
        open ? clearTimeout(timer) : restartTimer();
      }

      menuButton.addEventListener('click', () => toggleMenu());
      menuPanel.querySelectorAll('a').forEach(link => link.addEventListener('click', () => toggleMenu(false)));
      if (!reduceMotion) restartTimer();
    })();
  </script>
